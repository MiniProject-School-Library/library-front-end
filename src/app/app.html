<div class="app-container">

  <aside class="sidebar">
    <div class="logo-section">
      <div class="logo-icon">
        <i class="material-icons-round">local_library</i>
      </div>
      <span class="logo-text">Perpustakaan</span>
    </div>

    <ul class="nav-links">
      <li class="nav-item" [class.active]="activeTab() === 'books'" (click)="activeTab.set('books')">
        <i class="material-icons-round">auto_stories</i>
        <span>Katalog Buku</span>
      </li>
      <li class="nav-item" [class.active]="activeTab() === 'members'" (click)="activeTab.set('members')">
        <i class="material-icons-round">people_alt</i>
        <span>Data Anggota</span>
      </li>
      <li class="nav-item" [class.active]="activeTab() === 'rentals'" (click)="activeTab.set('rentals')">
        <i class="material-icons-round">swap_horiz</i>
        <span>Sewa & Kembali</span>
      </li>
    </ul>
  </aside>

  <main class="main-content">
    @if (activeTab() === 'books') {
      <app-books></app-books>
    }

    @if (activeTab() === 'members') {
      <app-members></app-members>
    }

    @if (activeTab() === 'rentals') {
      <app-rentals></app-rentals>
    }
  </main>
</div>
